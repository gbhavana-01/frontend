name: SonarCloud Analysis

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   types: [opened, synchronize, reopened]

jobs:
  SAST:
      name: CodeQL Scan
      runs-on: ubuntu-latest
      permissions:
        actions: read
        contents: read
        security-events: write   # required to upload results to the Security tab
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
  
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'     # change to match your project (18, 20, 22, etc.)
            cache: 'npm'           # use 'yarn' or 'pnpm' if applicable
  
        - name: Install dependencies
          run: npm ci              # use 'yarn install --frozen-lockfile' or 'pnpm install --frozen-lockfile' if applicable
  
        - name: Initialize CodeQL
          uses: github/codeql-action/init@v3
          with:
            languages: javascript-typescript
            queries: security-extended
  
        # Autobuild is optional for JS/TS — CodeQL can analyze without a build step.
        # Keep it only if your project has a build (TypeScript compilation, bundler, etc.)
        - name: Autobuild
          uses: github/codeql-action/autobuild@v3
  
        - name: Perform CodeQL Analysis
          uses: github/codeql-action/analyze@v3
          with:
            category: "/language:javascript-typescript"
  sonar-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
